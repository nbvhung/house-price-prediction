<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hệ Dự đoán Giá nhà</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body { background: linear-gradient(135deg, #dcfce7, #d1fae5); min-height: 100vh; padding: 16px; }
  .container { max-width: 560px; margin: 0 auto; }
  .header { background: linear-gradient(135deg, #059669, #0d9488); color: #fff; border-radius: 16px;
            padding: 24px 20px; text-align: center; box-shadow: 0 8px 20px rgba(5,150,105,.25); }
  .header h1 { font-size: 22px; margin-bottom: 6px; }
  .header p { font-size: 13px; opacity: .9; }
  .card { background: #fff; border-radius: 16px; padding: 20px; margin-top: 16px;
          box-shadow: 0 4px 14px rgba(0,0,0,.08); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 420px) { .grid { grid-template-columns: 1fr; } }
  label { font-size: 13px; font-weight: 600; color: #334155; display: block; margin-bottom: 4px; }
  input { width: 100%; padding: 11px 12px; border: 1.5px solid #cbd5e1; border-radius: 10px;
          font-size: 16px; outline: none; transition: border-color .2s; }
  input:focus { border-color: #059669; }
  button { width: 100%; margin-top: 16px; padding: 14px; border: none; border-radius: 12px;
           background: linear-gradient(135deg, #059669, #0d9488); color: #fff; font-size: 16px;
           font-weight: 700; cursor: pointer; box-shadow: 0 6px 14px rgba(5,150,105,.3); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; cursor: wait; }
  #result { display: none; margin-top: 16px; padding: 18px; border-radius: 14px; text-align: center;
            background: #ecfdf5; border: 1.5px solid #059669; }
  #result h2 { font-size: 24px; color: #047857; margin-bottom: 6px; }
  #result p { font-size: 14px; color: #475569; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>&#127968; Hệ Dự đoán Giá nhà</h1>
    <p>Mô hình Machine Learning &bull; Đơn vị: Tỷ VNĐ</p>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>Diện tích (m&sup2;)</label><input id="area" type="number" value="80" min="1"></div>
      <div><label>Mặt tiền (m)</label><input id="frontage" type="number" step="0.1" value="4"></div>
      <div><label>Đường vào (m)</label><input id="access_road" type="number" step="0.1" value="3"></div>
      <div><label>Số tầng</label><input id="floors" type="number" value="3" min="1"></div>
      <div><label>Số phòng ngủ</label><input id="bedrooms" type="number" value="3" min="1"></div>
      <div><label>Số WC</label><input id="bathrooms" type="number" value="2" min="1"></div>
    </div>
    <button onclick="predict()" id="btn">Dự đoán giá</button>
    <div id="result">
      <h2 id="r-price"></h2>
      <p id="r-msg"></p>
    </div>
  </div>
</div>

<script>
async function predict() {
  const btn = document.getElementById('btn');
  const box = document.getElementById('result');
  btn.disabled = true; btn.textContent = 'Đang ước tính...';
  const ids = ['area','frontage','access_road','floors','bedrooms','bathrooms'];
  const body = {};
  ids.forEach(i => body[i] = parseFloat(document.getElementById(i).value) || 0);
  try {
    const r = await fetch('/predict', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const d = await r.json();
    if (d.status === 'success') {
      box.style.display = 'block';
      document.getElementById('r-price').textContent = d.predicted_price_ty_vnd + ' Tỷ VNĐ';
      document.getElementById('r-msg').textContent = 'Giá ước tính cho ngôi nhà với thông số trên';
    } else {
      throw new Error('fail');
    }
  } catch (e) {
    box.style.display = 'block';
    document.getElementById('r-price').textContent = 'Lỗi kết nối';
    document.getElementById('r-price').style.fontSize = '18px';
    document.getElementById('r-msg').textContent = 'Không gọi được API. Kiểm tra server đã chạy chưa.';
  }
  btn.disabled = false; btn.textContent = 'Dự đoán giá';
}
</script>
</body>
</html>
